<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/dispositivos.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person,vpn_key,mail" />

</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
    
            </div>
            <div id="formulário">
                <h1>Login</h1>
                <p>Seja bem vindo(a) novamente. Faça login para acessar sua conta e poder fazer configurações no seu ambiente.</p>
                <form action="login.php" method="post" autocomplete="on">
                     <div class="info">
                        <div class="icone">
                            <label for="iemail" class="material-symbols-rounded">person</label>
                        </div>
                         
                         <input type="email" name="e-mail" id="iemail" placeholder="Seu email" autocomplete="email" required maxlength="30">
                     </div>
                     <div class="info"> 
                         <div class="icone">
                            <label for="isenha" class="material-symbols-rounded">vpn_key</label>
                        </div>
                         <input type="password" name="senha" id="isenha" placeholder="Sua senha" autocomplete="current-password" required minlength="8" maxlength="20">
                     </div>
                     <input type="submit">
                </form>
                <a href="esqueci.html" id="esqueci">Esqueci a senha<span id="mail" class="material-symbols-rounded" >mail</span></a>
            </div>
            
        </section>
    </main>
</body>
</html>
